[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-cli"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk",
    "anyio",
]

[project.optional-dependencies]
dotenv = ["python-dotenv"]

[project.scripts]
devex = "cli:main"

[tool.setuptools]
py-modules = ["cli"]
packages = ["prompts"]
